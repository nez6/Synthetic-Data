# Synthetic Test Data Creator — pipeline configuration.
# Cohort-specific inputs (demographics, fault rates) come from the UI, the API or a profile;
# this file holds everything that is fixed per deployment.

project:
  name: "synthetic-test-data-creator"
  mlflow_experiment: "synthetic_test_data_ml"
  random_state: 42

# Step 00 · where the dataset (the Synthea pools) is hosted. `python -m src.cloud_data download`
# fetches it; the Docker image does this on first start. DATA_BUCKET overrides the bucket.
cloud:
  provider: "Google Cloud Storage"
  bucket: "stdc-13890-data"
  prefix: "synthea-pools/v1"
  public_base_url: "https://storage.googleapis.com"

paths:
  runs_dir: "data/runs"                # one folder per dataset run
  hl7_inbox_db: "data/hl7_inbox.db"
  profile_script: "tools/data_quality_profile.py"

privacy:
  k_min_cell_size: 11                  # smallest count a profile may report (small-cell suppression)

# Plausibility bounds used by the validation script, the audit and the record-level quality score
quality_bounds:
  bmi: [10, 80]
  systolic_bp: [60, 260]
  hba1c: [3, 16]
  egfr: [1, 200]

# Record-level Data Quality Index (single records arriving via HL7 or FHIR)
quality_weights:
  missing_race_ethnicity: 15
  missing_birthdate: 25
  missing_sex: 10
  missing_lab: 10                      # per missing vital/lab
  implausible_lab: 25                  # per implausible vital/lab

acceptance:
  h0_rate: 0.85                        # H0: independent pass rate <= this
  target_rate: 0.90
  alpha: 0.05

ml:
  # Step 03 ("Each cohort is split 60/20/20 to train the model"). The model sees demographics only
  # (age, sex, race/ethnicity, cohort) and predicts whether a record passes validation.
  # The split is per cohort and can be overridden per request.
  split: {train: 0.6, test: 0.2, validation: 0.2}   # train fits · test tunes · validation = final score
  candidates: "logistic regression (C 0.1/1/10), random forest (depth 3/6); best ROC AUC on the test split"

hl7:
  host: "127.0.0.1"
  port: 2575                           # standard MLLP port
  start_with_api: true                 # the API process also runs the MLLP listener

# ---------------------------------------------------------------- Synthea (step 02)
synthea:
  version: "v4.0.0"
  jar: ".tools/synthea-v4.0.0.jar"           # sha256 ed43c20a... (same build as the reference project)
  java: ".tools/jre/Contents/Home/bin/java"  # falls back to `java` on PATH
  state: "Massachusetts"
  chunk_size: 100                            # patients per Synthea call; raw output is deleted after each chunk
  pools_dir: "data/pools"
  # Resource types kept from Synthea output (billing, provenance, imaging, documents are dropped)
  keep_types: [Patient, Encounter, Condition, AllergyIntolerance, MedicationRequest, MedicationStatement,
               Medication, Observation, Procedure, Immunization, DiagnosticReport, CarePlan, CareTeam]
  pools:
    A: {population: 600, min_age: 18, max_age: 64, years_of_history: 10, seed: 20261102}  # 10 yrs: enough immunization history; validation trims to the most recent care
    B: {population: 2500, min_age: 50, max_age: 90, years_of_history: 10, seed: 20261103}

# Chronic condition groups (SNOMED CT + ICD-10-CM prefixes), as in the reference project
condition_groups:
  chf: {snomed: ["88805009", "84114007", "42343007", "703272007"], icd10_prefixes: ["I50"]}
  ckd_esrd: {snomed: ["46177005", "431855005", "431856006", "433144002", "431857002", "709044004", "127013003"],
             icd10_prefixes: ["N18", "E11.2"]}
  t2d: {snomed: ["44054006"], icd10_prefixes: ["E11"]}
  copd: {snomed: ["185086009", "87433001", "13645005"], icd10_prefixes: ["J43", "J44"]}
